# Publish on a GitHub release. A version already on the registry is skipped,
# so re-running a failed job is safe.
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck && npm run build && npm test
      - name: Publish unless this version exists
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@profullstack/live-translate@$VERSION" version >/dev/null 2>&1; then
            echo "already published: $VERSION"
          else
            npm publish --provenance --access public
          fi
